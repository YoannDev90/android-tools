[package]
name = "dpx"
version = "0.1.0"
edition = "2021"
description = "px ↔ dp ↔ sp converter — offline, or against the device's real density"
license = "MIT"

[metadata]
long_description = "Converts Android dimensions between px, dp and sp from the command line. Offline by default (any density value works, mdpi 160 dpi as the baseline), or --device reads the real density from the connected device via wm density, override winning over physical — that is what the UI actually draws at. Takes several values at once, one result per line, and honours a custom font scale for sp."
readme = "dpx/README.md"
license_file = "dpx/LICENSE"
manifest = "dpx/Cargo.toml"
entrypoint = "dpx/src/main.rs"
category = "development"
tags = ["android", "dp", "px", "sp", "density", "converter", "typography", "cli"]
requires = { adb = "only for --device mode: Android SDK platform-tools in PATH" }
features = ["px ↔ dp ↔ sp in any direction (px = dp × density / 160, sp scales with the font scale)", "--device reads the real density from wm density (override wins over physical)", "Several values per call, one result per line", "Pure conversion core, fully tested without a device"]
dependencies = { adbkit = "0.1 (path)", anyhow = "1", clap = "4" }
tests = true
source = { files = ["main.rs", "convert.rs"] }
