[package]
name = "uitool"
version = "0.1.0"
edition = "2021"
description = "Practical Android UI driver — dump, find, tap, shot over adb"
license = "MIT"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "uitool"
path = "src/main.rs"

[dependencies]
adbkit = { path = "../adbkit", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
