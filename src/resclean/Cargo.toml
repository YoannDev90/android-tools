[package]
name = "resclean"
version = "0.1.0"
edition = "2021"
description = "Dead res/ resource detector for Android projects — CI gate"
license = "MIT"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "resclean"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
