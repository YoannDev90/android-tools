[package]
name = "perfpoll"
version = "0.1.0"
edition = "2021"
description = "Per-app perf sampler over adb — CPU, RAM, battery drain, fps to CSV"
license = "MIT"

[[bin]]
name = "perfpoll"
path = "src/main.rs"

[dependencies]
adbkit = { path = "../adbkit", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
