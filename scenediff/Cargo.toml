[package]
name = "scenediff"
version = "0.1.0"
edition = "2021"
description = "Visual regression diff of two screenshots, files or device captures"
license = "MIT"

[[bin]]
name = "scenediff"
path = "src/main.rs"

[dependencies]
adbkit = { path = "../adbkit" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
