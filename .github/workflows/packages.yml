# Triggered by the Release workflow's *completion*, not by the `release` event:
# release.yml creates the release with GITHUB_TOKEN, and GitHub never fires a
# workflow run for an event caused by GITHUB_TOKEN (only workflow_dispatch and
# repository_dispatch are exempt) — so `on: release:` would never run at all.
# Waiting for the Release run to finish also guarantees the release exists
# before softprops/action-gh-release attaches to it, and before dist's own
# `gh release create` runs.
#
# Builds static musl binaries natively on each runner arch — no C dependencies
# in the workspace, so musl-tools is enough.
name: Packages

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build packages for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deb-rpm:
    # workflow_run also fires for Release's pull_request "plan" runs; only act
    # on a tag push that actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    name: ${{ matrix.deb_arch }} deb+rpm
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            nfpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Resolve release tag
        id: reltag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$RUN_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.reltag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.43.1"
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz" \
            | tar xz -C /tmp nfpm
          sudo install /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Generate nfpm configs
        env:
          RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          python3 scripts/make_nfpm.py /tmp/nfpm \
            "${RELEASE_TAG#v}" \
            "target/${{ matrix.target }}/release" \
            "${{ matrix.deb_arch }}"

      - name: Build .deb and .rpm
        run: |
          mkdir -p dist-packages
          for cfg in /tmp/nfpm/*.nfpm.yaml; do
            nfpm package --config "$cfg" --packager deb --target "dist-packages/"
            nfpm package --config "$cfg" --packager rpm --target "dist-packages/"
          done
          ls -la dist-packages/

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          # github.ref is the default branch under workflow_run, not the tag.
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: dist-packages/*
