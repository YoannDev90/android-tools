name: Winget probe
# Sonde jetable : découvre la séquence exacte des prompts interactifs de
# `komac new` pour un installeur ZIP, sans rien soumettre. Supprimé après.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install komac
        run: |
          curl -sL "https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          /tmp/komac --version

      - name: Probe prompts (PTY)
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          mkdir -p /tmp/out
          # Espace sélectionne le 1er fichier imbriqué, puis Entrée en boucle
          # pour avaler les prompts restants (Text accepte la saisie vide).
          { printf ' '; for _ in $(seq 1 40); do printf '\n'; done; } > /tmp/keys

          set +e
          script -qefc '/tmp/komac new YoannDev90.apkctl \
            --version 0.1.0 \
            --urls https://github.com/YoannDev90/android-tools/releases/download/v0.1.0/apkctl-x86_64-pc-windows-msvc.zip \
            --package-locale en-US \
            --publisher YoannDev90 \
            --publisher-url https://github.com/YoannDev90 \
            --package-name apkctl \
            --package-url https://github.com/YoannDev90/android-tools \
            --author YoannDev90 \
            --license MIT \
            --license-url https://github.com/YoannDev90/android-tools/blob/main/LICENSE \
            --short-description "App lifecycle over adb - clear, restart, kill, monitor" \
            --description "App lifecycle over adb - clear data and cache, restart, kill, monitor processes." \
            --moniker apkctl \
            --output /tmp/out' \
            /tmp/transcript < /tmp/keys
          echo "komac exit=$?"
          set -e

          echo "══════ TRANSCRIPT ══════"
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/transcript
          echo "══════ FICIERS GÉNÉRÉS ══════"
          find /tmp/out -type f 2>/dev/null || echo "(aucun)"
