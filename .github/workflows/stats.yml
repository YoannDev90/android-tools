# Refreshes stats.json — the JSON the README's shields.io badges poll.
#
# Scheduled rather than folded into CI: it is the only generated file that
# needs the network, and CI regenerates README.md/index.json offline and
# fails when they differ (`git diff --exit-code`).
#
# generate_stats.py leaves the file untouched unless a count actually moved,
# and the commit carries [skip ci] as a second guard, so a routine run costs
# neither a commit nor a build.
name: Download stats

on:
  schedule:
    # Every 6 hours, off the :00 mark where cron runs queue up.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commit when the counts moved
        run: |
          if git diff --quiet -- stats.json; then
            echo "stats.json already current — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "chore: refresh download stats [skip ci]"
          git push
