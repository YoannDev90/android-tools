# Publish every crate to crates.io, right after a release is published.
#
# adbkit goes first and each publish is retried until crates.io indexes it,
# because the tools depend on the registry copy of adbkit — a path dep alone
# won't satisfy `cargo publish`'s verification build.
#
# Triggered by the Release workflow's *completion*, not by the `release` event.
# release.yml creates the release with GITHUB_TOKEN, and GitHub never fires a
# workflow run for an event caused by GITHUB_TOKEN (only workflow_dispatch and
# repository_dispatch are exempt) — so `on: release:` would never run at all.
# workflow_dispatch is the manual escape hatch; pass the tag explicitly.
#
# Requires the CARGO_REGISTRY_TOKEN secret (crates.io API token).
name: Publish crates.io

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # workflow_run also fires for Release's pull_request "plan" runs; only act
    # on a tag push that actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: reltag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$RUN_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.reltag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate versions
        env:
          RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for crate in adbkit apkctl assetgen dp2px layoutlint logstream perfpoll resclean scenediff startperf svg2vd iconkit uitool; do
            crate_version=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='$crate'))")
            if [ "$crate_version" != "$version" ]; then
              echo "::error::$crate is at $crate_version but the release tag says $version"
              exit 1
            fi
          done
          echo "all crates at $version"

      - name: Publish crates (adbkit first, retry on index lag)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          log=$(mktemp)

          # This workflow is re-dispatchable: crates that made it out on an
          # earlier attempt must count as done, not as a failure.
          already_on_crates_io() {
            local body
            body=$(curl -sf -A "android-tools-ci/0.1" "https://crates.io/api/v1/crates/$1" || true)
            printf '%s' "$body" | grep -q "\"num\":\"$2\""
          }

          publish() {
            crate=$1
            if already_on_crates_io "$crate" "${RELEASE_TAG#v}"; then
              echo "$crate ${RELEASE_TAG#v} already on crates.io — skipping"
              return 0
            fi
            for attempt in $(seq 1 15); do
              # errexit off for the pipeline only: under pipefail cargo's
              # non-zero would kill the script before PIPESTATUS is read.
              set +e
              cargo publish -p "$crate" --allow-dirty 2>&1 | tee "$log"
              # tee's status, not cargo's — reading PIPESTATUS is the only way
              # to get cargo's code back out of a pipeline.
              status=${PIPESTATUS[0]}
              set -e
              if [ "$status" -eq 0 ]; then
                echo "$crate published"
                return 0
              fi
              sed 's/\x1b\[[0-9;]*m//g' "$log" > "$log.clean"

              # HTTP 400 is a rejection, not a race (unverified email, bad
              # metadata, version already taken) — retrying would only burn
              # three minutes before failing anyway. "Already uploaded" is the
              # exception: it means an earlier attempt got it out.
              if grep -q "(status 400 " "$log.clean"; then
                if grep -qi "already uploaded\|already published" "$log.clean"; then
                  echo "$crate already on crates.io — skipping"
                  return 0
                fi
                echo "::error::$crate was rejected by crates.io (HTTP 400) — retrying will not help"
                return 1
              fi

              # HTTP 429: crates.io throttles how many *new* crates may be
              # pushed inside a window and states exactly when it reopens.
              # Sleep until then — burning 15s retries against a closed door
              # only exhausts the attempt budget while it is still shut.
              if grep -q "(status 429 " "$log.clean"; then
                when=$(sed -n 's/.*try again after \(.*\) GMT.*/\1/p' "$log.clean" | tail -1)
                if [ -n "$when" ] && resume_at=$(date -u -d "$when" +%s 2>/dev/null); then
                  sleep_for=$(( resume_at - $(date -u +%s) + 20 ))
                  if [ "$sleep_for" -gt 0 ]; then
                    echo "rate-limited: crates.io until $when GMT, waiting ${sleep_for}s"
                    sleep "$sleep_for"
                    continue
                  fi
                fi
                echo "rate-limited with no usable retry-after, backing off 60s"
                sleep 60
                continue
              fi

              # Index lag: a dependency landed moments ago and is not in the
              # local index yet.
              echo "$crate: not indexed yet, retry $attempt/15 in 15s"
              sleep 15
            done
            echo "::error::failed to publish $crate"
            return 1
          }
          publish adbkit
          # svg2vd before iconkit: iconkit depends on the published copy.
          for crate in apkctl assetgen dp2px layoutlint logstream perfpoll resclean scenediff startperf svg2vd iconkit uitool; do
            publish "$crate" || exit 1
          done
