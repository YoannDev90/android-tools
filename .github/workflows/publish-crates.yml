# Publish every crate to crates.io, right after a release is published.
#
# adbkit goes first and each publish is retried until crates.io indexes it,
# because the tools depend on the registry copy of adbkit — a path dep alone
# won't satisfy `cargo publish`'s verification build.
#
# Triggered by the Release workflow's *completion*, not by the `release` event.
# release.yml creates the release with GITHUB_TOKEN, and GitHub never fires a
# workflow run for an event caused by GITHUB_TOKEN (only workflow_dispatch and
# repository_dispatch are exempt) — so `on: release:` would never run at all.
# workflow_dispatch is the manual escape hatch; pass the tag explicitly.
#
# Requires the CARGO_REGISTRY_TOKEN secret (crates.io API token).
name: Publish crates.io

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # workflow_run also fires for Release's pull_request "plan" runs; only act
    # on a tag push that actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: reltag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$RUN_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.reltag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate versions
        env:
          RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for crate in adbkit apkctl assetgen dp2px layoutlint logstream perfpoll resclean scenediff startperf svg2vd iconkit uitool; do
            crate_version=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c "import json,sys; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='$crate'))")
            if [ "$crate_version" != "$version" ]; then
              echo "::error::$crate is at $crate_version but the release tag says $version"
              exit 1
            fi
          done
          echo "all crates at $version"

      - name: Publish crates (adbkit first, retry on index lag)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            crate=$1
            for attempt in $(seq 1 12); do
              if cargo publish -p "$crate" --allow-dirty; then
                echo "$crate published"
                return 0
              fi
              echo "$crate: not indexed yet, retry $attempt/12 in 15s"
              sleep 15
            done
            echo "::error::failed to publish $crate"
            return 1
          }
          publish adbkit
          # svg2vd before iconkit: iconkit depends on the published copy.
          for crate in apkctl assetgen dp2px layoutlint logstream perfpoll resclean scenediff startperf svg2vd iconkit uitool; do
            publish "$crate" || exit 1
          done
