name: Winget bootstrap
#
# winget-releaser (winget.yml) can only UPDATE a package that already exists
# upstream, so a brand-new identifier needs `komac new` once. That command is
# interactive: no flag answers "which nested files", "install modes" or
# "upgrade behaviour". A blind key sequence proved unreliable (the nested-file
# MultiSelect swallows rejected Enters and starves the later prompts), so this
# drives a PTY and answers by reading what is actually on screen.
#
# Generation writes manifests with --output and picks Exit, so nothing leaves
# the runner until the submit step. `komac submit` then opens the PR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v0.1.0)"
        required: true
        type: string
      submit:
        description: "Open the PR upstream (off = generate and print only)"
        type: boolean
        default: false
      packages:
        description: "Space/comma-separated subset to bootstrap (empty = all 12)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Resolves the requested subset into a matrix so the first submission can be
  # kept small — opening a dozen brand-new identifiers at once on
  # microsoft/winget-pkgs looks like spam to its maintainers.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          all="apkctl assetgen dp2px iconkit layoutlint logstream perfpoll resclean scenediff startperf svg2vd uitool"
          chosen="${PACKAGES//,/ }"
          if [ -z "${chosen// /}" ]; then chosen="$all"; fi
          for p in $chosen; do
            case " $all " in
              *" $p "*) ;;
              *) echo "::error::unknown package: $p"; exit 1 ;;
            esac
          done
          CHOSEN="$chosen" python3 -c 'import json, os; print("matrix=" + json.dumps({"package": os.environ["CHOSEN"].split()}))' >> "$GITHUB_OUTPUT"
          echo "bootstrap: $chosen"

  bootstrap:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install komac
        run: |
          curl -sL "https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          /tmp/komac --version

      - name: Generate manifest (PTY)
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PKG: ${{ matrix.package }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          DESC=$(python3 -c "
          import json
          d = json.load(open('index.json'))
          print(next(x['description'] for x in d['tools'] if x['id'] == '$PKG'))")
          export DESC

          cat > /tmp/drive.py <<'PY'
          import os, pty, re, select, time

          ANSI = re.compile(rb'\x1b\[[0-9;?]*[A-Za-z]')
          PKG = os.environ["PKG"]
          TAG = os.environ["RELEASE_TAG"]
          VER = TAG.lstrip("v")
          REPO = "https://github.com/YoannDev90/android-tools"
          DESC = os.environ["DESC"]

          ARGV = [
              "/tmp/komac", "new", f"YoannDev90.{PKG}",
              "--version", VER,
              "--urls", f"{REPO}/releases/download/{TAG}/{PKG}-x86_64-pc-windows-msvc.zip",
              "--package-locale", "en-US",
              "--publisher", "YoannDev90",
              "--publisher-url", "https://github.com/YoannDev90",
              "--package-name", PKG,
              "--package-url", REPO,
              "--author", "YoannDev90",
              "--license", "MIT",
              "--license-url", f"{REPO}/blob/main/LICENSE",
              "--short-description", DESC,
              "--description", DESC,
              "--moniker", PKG,
              "--output", "/tmp/out",
          ]

          def visible(buf):
              return ANSI.sub(b"", buf).decode("utf-8", "replace")

          def prompt_line(text):
              """The inquire question painted now: last line starting with '?'."""
              lines = [ln for ln in text.splitlines() if ln.strip().startswith("?")]
              return lines[-1] if lines else ""

          def key_for(recent, prompt):
              # The hint is painted after its own '?', so slicing there stops a
              # stale MultiSelect hint from leaking into the next prompt.
              after_last_prompt = recent[recent.rfind("?"):]
              # A MultiSelect paints "→ to all" and refuses to submit until at
              # least one option is selected, so the arrow does both jobs.
              if "to all" in after_last_prompt:
                  return b"\x1b[C\n"
              # Validates its input, so an empty Enter is rejected — the alias
              # has to be typed, and it is just the tool name.
              if "Portable command alias" in prompt:
                  return PKG.encode() + b"\n"
              # Submit, Edit, Exit — pick Exit so the PR is opened separately.
              if "What would you like to do" in prompt:
                  return b"\x1b[B\x1b[B\n"
              # Text / Select: empty input is accepted there.
              return b"\n"

          def main():
              pid, fd = pty.fork()
              if pid == 0:
                  os.execvp(ARGV[0], ARGV)
              buf, mark, shown_at, sent, start = b"", 0, time.time(), 0, time.time()
              while True:
                  if time.time() - start > 300 or sent > 40:
                      os.kill(pid, 9)
                      break
                  ready, _, _ = select.select([fd], [], [], 0.2)
                  if ready:
                      try:
                          chunk = os.read(fd, 65536)
                      except OSError:
                          break
                      if not chunk:
                          break
                      buf += chunk
                      shown_at = time.time()
                  # Answer only once the repaint has stopped, and only look at
                  # bytes produced since the last key: the buffer still holds
                  # every earlier prompt, which is what made the first attempt
                  # keep sending spaces into a text field.
                  if sent < 40 and time.time() - shown_at > 1.2:
                      recent = visible(buf[mark:])
                      prompt = prompt_line(recent)
                      if prompt:
                          os.write(fd, key_for(recent, prompt))
                          mark = len(buf)
                          sent += 1
                          shown_at = time.time()
                  done, _ = os.waitpid(pid, os.WNOHANG)
                  if done:
                      break
              print(f"--- keys sent: {sent} ---")
              print("--- transcript tail ---")
              print(visible(buf)[-3000:])

          main()
          PY

          python3 /tmp/drive.py

          # The release body is one entry per tool, so it describes 11 other
          # packages beside this one — komac copies it verbatim into every
          # manifest (~25 kB). The URL still points at it, so drop the dump.
          python3 - <<'PY'
          import pathlib, re

          for f in pathlib.Path("/tmp/out").rglob("*.yaml"):
              text = f.read_text()
              stripped = re.sub(r"^ReleaseNotes:.*\n(?:[ \t].*\n|\n)*", "", text, flags=re.M)
              if stripped != text:
                  f.write_text(stripped)
          PY

          echo "══════ manifests générés ══════"
          find /tmp/out -type f -print -exec cat {} \; 2>/dev/null || {
            echo "::error::aucune manifest générée"
            exit 1
          }

      - name: Submit PR
        if: ${{ inputs.submit }}
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: /tmp/komac submit /tmp/out -y --token "$GITHUB_TOKEN"
