[package]
name = "startperf"
version = "0.1.0"
edition = "2021"
description = "App cold/warm start benchmark over adb"
license = "MIT"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "startperf"
path = "src/main.rs"

[dependencies]
adbkit = { path = "../adbkit", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
