[package]
name = "startperf"
version = "0.1.0"
edition = "2021"
description = "App cold/warm start benchmark over adb"
license = "MIT"

[metadata]
long_description = "Measures cold and warm app launch times without Android Studio: runs `am start -W` N times against an activity, parses the framework-reported timings (TotalTime/WaitTime/ThisTime), and summarizes them as min/median/mean/max/stddev. Reports as a table, JSON or CSV, and skips runs Android admits it did not really launch."
readme = "startperf/README.md"
license_file = "startperf/LICENSE"
manifest = "startperf/Cargo.toml"
entrypoint = "startperf/src/main.rs"
category = "benchmark"
tags = ["android", "adb", "performance", "benchmark", "startup", "am-start", "cli"]
requires = { adb = "Android SDK platform-tools in PATH", installed_package = true }
features = ["Cold mode force-stops before every run; warm mode presses HOME so the process stays alive and the activity is recreated", "Runs where Android admits it launched nothing (\"brought to the front\" in cold mode, \"top-most instance\" anywhere) are skipped, not counted", "min/median/mean/max/stddev — median reported because cold samples skew", "JSON report and spreadsheet-ready CSV with one row per run", "Launcher activity resolved automatically via adbkit (or pass --component)"]
dependencies = { adbkit = "0.1 (path)", anyhow = "1", clap = "4", serde = "1", serde_json = "1" }
tests = true
source = { files = ["main.rs", "parse.rs", "run.rs", "stats.rs", "output.rs"] }
