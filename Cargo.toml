[workspace]
resolver = "2"
members = ["src/adbkit", "src/apkctl", "src/assetgen", "src/dp2px", "src/iconkit", "src/layoutlint", "src/logstream", "src/perfpoll", "src/resclean", "src/scenediff", "src/startperf", "src/svg2vd", "src/uitool"]

[workspace.package]
repository = "https://github.com/YoannDev90/android-tools"
homepage = "https://github.com/YoannDev90/android-tools"

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
