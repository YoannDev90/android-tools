[package]
name = "appctl"
version = "0.1.0"
edition = "2021"
description = "App lifecycle over adb — clear data/cache, restart, kill, uninstall, deep links, one or every device"
license = "MIT"

[metadata]
long_description = "Runs the app-lifecycle actions IntelliJ's adb-idea puts behind a click, from the command line: clear data (pm clear) or cache only (pm trim-caches 0 — the Storage \"clear cached data\" path; pm clear --cache-only stalls on some builds), force-stop, restart (force-stop then relaunch on the launcher activity resolved at run time), uninstall, open the app's Settings page, and open a deep link. Acts on one device, several -s serials, or every connected device at once (--all); one line per device, [serial] prefix when there are several, exit 1 if any failed after every device was tried. Package names and URIs are validated instead of interpolated, so shell metacharacters never reach the device shell, and every device command has a 10s deadline so a stalled adb shell errors instead of hanging."
readme = "appctl/README.md"
license_file = "appctl/LICENSE"
manifest = "appctl/Cargo.toml"
entrypoint = "appctl/src/main.rs"
category = "automation"
tags = ["android", "adb", "app", "lifecycle", "deep-link", "uninstall", "testing", "cli", "multi-device"]
requires = { adb = "Android SDK platform-tools in PATH", device = "Connected device/emulator with USB debugging authorized" }
features = ["7 actions: clear-data, clear-cache (pm trim-caches), kill, restart, uninstall, Settings page, open deep link", "--all runs on every connected device, -s is repeatable: one line per device", "Restart resolves the launcher activity at run time (no hardcoded .MainActivity)", "Package names and URIs validated, never interpolated into the device shell", "Every device command has a 10s deadline: a stalled adb shell errors instead of hanging", "Exit 1 if any device failed, after every device was tried"]
dependencies = { adbkit = "0.1 (path)", anyhow = "1", clap = "4" }
tests = true
source = { files = ["main.rs", "cmds.rs"] }
