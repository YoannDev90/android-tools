[package]
name = "layoutlint"
version = "0.1.0"
edition = "2021"
description = "UI hierarchy lint — touch targets, overlap, labels, from a uiautomator dump"
license = "MIT"

[[bin]]
name = "layoutlint"
path = "src/main.rs"

[dependencies]
adbkit = { path = "../adbkit" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
